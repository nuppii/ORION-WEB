name: Deploy ORION website to GitHub Pages

on:
  push:
    branches:
      - main
      - WEB-TEST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out WEB-TEST website
        uses: actions/checkout@v6
        with:
          ref: WEB-TEST

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build WEB-TEST frontend
        working-directory: frontend
        env:
          CI: "false"
          PUBLIC_URL: /ORION-WEB
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
